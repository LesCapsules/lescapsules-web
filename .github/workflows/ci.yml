name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    uses: browniebroke/github-actions/.github/workflows/ts-lint.yml@8fb2a2c1a48f4a3d627edcfe4355c734cee9f0c1 # v2.0.0
  deploy:
    uses: browniebroke/github-actions/.github/workflows/netlify-deploy.yml@8f15f824db9f3acbcf0edf9c6112a86f5e244665 # v1.28.1
    with:
      netlify_site_id: '4b203ef5-3ac6-4b51-afcb-564239b2ef86'
      publish_dir: 'out'
    secrets:
      netlify_auth_token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
